spring.application.name=service_backend
spring.datasource.url=jdbc:mysql://localhost:3306/java_backend
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#jwt
spring.jwt.secretKey=${JWT_SECRET}
spring.jwt.accessTokenExpiration=900
spring.jwt.refreshTokenExpiration=604800

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

#spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.main.allow-circular-references=true